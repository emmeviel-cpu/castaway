<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f3d3e">
  <title>Castaway</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Castaway</h1>
    <p class="tagline">Metti le cuffie e cammina. Ti racconto cosa c'è intorno.</p>
  </header>

  <main>
    <button id="tell" class="primary">Cosa c'è qui intorno?</button>
    <button id="stop" class="secondary" hidden>Ferma la voce</button>
    <p id="status" role="status" aria-live="polite"></p>
    <ol id="places"></ol>
  </main>

  <script src="wiki.js"></script>
  <script src="app.js"></script>
</body>
</html>
